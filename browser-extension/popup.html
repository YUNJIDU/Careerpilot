<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareerPilot 安全预填</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header><b>CareerPilot</b><span>安全预填</span></header>
    <main>
      <label>会话 ID<input id="session" autocomplete="off" /></label>
      <button id="preview">读取并预览差异</button>
      <p id="message" role="status">只处理当前标签页，不读取密码和文件。</p>
      <section id="result" hidden>
        <h2>即将填入</h2>
        <div id="diff"></div>
        <button id="fill" disabled>确认预填</button>
        <small>预填后请自行检查；验证码和最终提交必须手工完成。</small>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python_lock: backend/requirements/linux-dev.lock
          - os: windows-2025
            python_lock: backend/requirements/windows-dev.lock
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.python_lock }}
      - run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --requirement "${{ matrix.python_lock }}"
      - run: python -m pip install --no-deps --no-build-isolation --editable ./backend
      - run: python -m pytest backend/tests -q
      - run: python -m ruff check backend
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  browser-e2e:
    name: Browser E2E (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements/windows-dev.lock
      - run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --requirement backend/requirements/windows-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation --editable ./backend
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend

  security:
    name: Dependency, license and secret checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements/linux-dev.lock
            backend/requirements/linux-security.lock
      - run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --requirement backend/requirements/linux-dev.lock
          --requirement backend/requirements/linux-security.lock
      - run: python -m pip install --no-deps --no-build-isolation --editable ./backend
      - run: python -m pip_audit
      - run: pip-licenses --with-urls --format=markdown
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-smoke:
    name: Docker build and smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: docker build --tag careerpilot:ci .
      - name: Scan release image
        shell: bash
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            docker.io/aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --format json \
            --quiet \
            --image-src docker \
            careerpilot:ci > trivy-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("trivy-report.json").read_text())
          vulnerabilities = [
              vulnerability
              for result in report.get("Results", [])
              for vulnerability in result.get("Vulnerabilities") or []
          ]
          blocking = [
              vulnerability
              for vulnerability in vulnerabilities
              if vulnerability["Severity"] == "CRITICAL"
              or (vulnerability["Severity"] == "HIGH" and vulnerability.get("FixedVersion"))
          ]
          for vulnerability in blocking:
              print(
                  vulnerability["Severity"],
                  vulnerability["VulnerabilityID"],
                  vulnerability["PkgName"],
                  vulnerability["InstalledVersion"],
                  "->",
                  vulnerability.get("FixedVersion") or "unfixed",
              )
          if blocking:
              raise SystemExit(f"Trivy gate failed with {len(blocking)} blocking vulnerabilities")
          print("Trivy gate passed")
          PY
      - name: Start release image
        run: docker run --detach --name careerpilot-ci --publish 127.0.0.1:9998:9998 --publish 127.0.0.1:9999:9998 careerpilot:ci
      - name: Wait for health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9998/api/v1/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs careerpilot-ci
          exit 1
      - name: Smoke test API and web
        shell: bash
        run: |
          curl --fail http://127.0.0.1:9998/api/v1/health
          curl --fail http://127.0.0.1:9999/ | grep --fixed-strings "CareerPilot"
          curl --fail \
            --header "Content-Type: application/json" \
            --data '{"company":"CI Company","role":"Release Engineer","idempotency_key":"docker-smoke"}' \
            http://127.0.0.1:9998/api/v1/applications
          curl --fail http://127.0.0.1:9998/api/v1/applications | grep --fixed-strings "CI Company"
      - name: Show container logs
        if: always()
        run: docker logs careerpilot-ci
      - name: Stop container
        if: always()
        run: docker rm --force careerpilot-ci
